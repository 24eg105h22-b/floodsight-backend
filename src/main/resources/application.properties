spring.application.name=flood-depth-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8081}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true




# Backend-only routing. Missing key returns a safe unavailable result; production never uses fixture routes.
geoapify.api-key=${GEOAPIFY_API_KEY:}
geoapify.timeout-ms=${GEOAPIFY_TIMEOUT_MS:10000}
flood.routing.report-distance-meters=${FLOOD_ROUTING_REPORT_DISTANCE_METERS:25}
flood.routing.observation-zone=${FLOOD_ROUTING_OBSERVATION_ZONE:Asia/Kolkata}
flood.routing.rainy-months=${FLOOD_ROUTING_RAINY_MONTHS:6,7,8,9,10}

gemini.enabled=${GEMINI_ENABLED:false}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:60000}
# Combined image analysis (including optional overlay) only; connect timeout and other operations remain independent.
gemini.combined-analysis-timeout-ms=${GEMINI_COMBINED_ANALYSIS_TIMEOUT_MS:600000}
# Optional spatial annotation; registration failure leaves the normal visual estimate available.
depth.visual-grid.enabled=${DEPTH_VISUAL_GRID_ENABLED:true}
depth.visual-grid.diagnostics.enabled=${DEPTH_VISUAL_GRID_DIAGNOSTICS_ENABLED:false}
depth.visual-grid.diagnostics.directory=${DEPTH_VISUAL_GRID_DIAGNOSTICS_DIRECTORY:target/diagnostics/latest}
gemini.diagnostics.enabled=${GEMINI_DIAGNOSTICS_ENABLED:false}
gemini.scene.max-image-dimension=${GEMINI_SCENE_MAX_IMAGE_DIMENSION:1280}

# Independent reference-image retrieval; credentials are backend-only.
mapillary.access-token=${MAPILLARY_ACCESS_TOKEN:}
mapillary.timeout-ms=${MAPILLARY_TIMEOUT_MS:10000}
mapillary.search-radius-meters=${MAPILLARY_SEARCH_RADIUS_METERS:100}
mapillary.proximity.strong-meters=${MAPILLARY_STRONG_PROXIMITY_METERS:30}
mapillary.proximity.good-meters=${MAPILLARY_GOOD_PROXIMITY_METERS:75}
mapillary.proximity.weak-meters=${MAPILLARY_WEAK_PROXIMITY_METERS:125}


