spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.data-source-properties.sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.hikari.data-source-properties.useSSL=${DB_USE_SSL:true}
spring.datasource.hikari.data-source-properties.requireSSL=${DB_REQUIRE_SSL:true}
spring.datasource.hikari.data-source-properties.serverTimezone=${DB_SERVER_TIMEZONE:UTC}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
